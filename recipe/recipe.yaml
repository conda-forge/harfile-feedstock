schema_version: 1

context:
  name: harfile
  version: "0.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/harfile-${{ version }}.tar.gz
  sha256: 3e5751d52c59bda35789748256cbac097b664e65315d15ded67b006c173e34b3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - harfile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Writer for HTTP Archive (HAR) files
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/schemathesis/harfile

extra:
  recipe-maintainers:
    - thewchan
