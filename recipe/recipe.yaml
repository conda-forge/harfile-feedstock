schema_version: 1

context:
  name: harfile
  version: "0.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/harfile-${{ version }}.tar.gz
  sha256: 133e7fd1b8e5222d5052779307e8527906363e368971e134ae77f4f7d07d8b23

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - harfile
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Writer for HTTP Archive (HAR) files
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/schemathesis/harfile

extra:
  recipe-maintainers:
    - thewchan
